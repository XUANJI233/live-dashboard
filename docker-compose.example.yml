# Quick start with pre-built image — no need to clone or build from source.
# 1. Copy this file:  cp docker-compose.example.yml docker-compose.yml
# 2. Create .env:     cp .env.example .env   (then fill in your tokens)
# 3. Run:             docker compose up -d

services:
  dashboard:
    image: ghcr.io/monika-dream/live-dashboard:latest
    container_name: live_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "127.0.0.1:${MCP_PORT:-3031}:${MCP_PORT:-3031}"
    environment:
      - DB_PATH=/data/live-dashboard.db
      - DEVICE_TOKEN_1=${DEVICE_TOKEN_1}
      - DEVICE_TOKEN_2=${DEVICE_TOKEN_2}
      - HASH_SECRET=${HASH_SECRET}
      - EDGE_MODE=${EDGE_MODE:-false}
      - REQUIRE_EDGE=${REQUIRE_EDGE:-false}
      - MCP_PORT=${MCP_PORT:-3031}
      - MCP_HOST=${MCP_HOST:-127.0.0.1}
      - MCP_LOOPBACK_TOKENLESS_ENABLED=${MCP_LOOPBACK_TOKENLESS_ENABLED:-false}
      - MCP_LOCAL_NETWORK_ENABLED=${MCP_LOCAL_NETWORK_ENABLED:-false}
      - MCP_REMOTE_ENABLED=${MCP_REMOTE_ENABLED:-false}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:-}
      - MCP_ADMIN_TOKEN=${MCP_ADMIN_TOKEN:-}
      - AI_API_URL=${AI_API_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
    volumes:
      - dashboard_data:/data
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dashboard_data:
